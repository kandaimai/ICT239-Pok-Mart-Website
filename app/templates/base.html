<!DOCTYPE html>
<html lang="en">
<head>
  {% block head %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Poké Mart{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">

  <!-- Optional custom CSS -->
  <style>
    body {
      background-color: #fefefe;
    }
    .navbar-brand img {
      height: 40px;
    }
    footer {
      background-color: #f8f9fa;
      padding: 1rem 0;
    }
  </style>
  {% endblock %}
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="http://127.0.0.1:5000/">
        Poké Mart
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:5000/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:5000/shop">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:5000/cart">Cart</a></li>
          <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:5000/about">About</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-5">
    {% block content %}
    <!-- Child templates (e.g., shop, cart, about) will override this -->
    {% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center border-top">
    {% block footer %}
    <p class="mb-0 text-muted">&copy; {{ current_year or 2025 }} Poké Mart — A Trainer’s Best Friend</p>
    {% endblock %}
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
